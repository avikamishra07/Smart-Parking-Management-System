spring.application.name=parking
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/parking

# PostgreSQL (override with environment variables if needed)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/parkingdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Schema is created by sql/schema.sql; Hibernate only validates entities against it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Fee configuration: Rs 50 per started 3-hour block
parking.fee.block-hours=3
parking.fee.rate-per-block=50
